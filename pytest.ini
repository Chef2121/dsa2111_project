# pytest settings for the Radview test suite (python -m pytest -q).
# Tests that need pipeline outputs skip themselves when the data folder is empty (as in the Docker build).
# Library deprecation and future warnings are hidden: they come from dependencies, not from Radview.
[pytest]
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
